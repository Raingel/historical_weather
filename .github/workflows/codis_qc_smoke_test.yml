name: CODIS QC Smoke Test

on:
  push:
    branches:
      - fix/report-failed-codis-chunks

permissions:
  contents: read

jobs:
  codis-qc-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tools
            requirements.txt
            data/466920
            data_codis_rebuild_full/466920
            data_codis_legacy_compatible/466920
          sparse-checkout-cone-mode: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run limited CODIS updater smoke test
        shell: bash
        run: |
          mkdir -p reports/codis_daily_update
          set +e
          set -o pipefail
          python -u tools/run_daily_codis_update.py \
            --station 466920 \
            --lookback-days 3 \
            --timeout 60 \
            --max-retries 2 \
            --retry-backoff-seconds 2 \
            --skip-sync-data \
            2>&1 | tee reports/codis_daily_update/pipeline.log
          PIPELINE_STATUS=${PIPESTATUS[0]}
          set +o pipefail
          set -e

          grep -F "[WARN] skip chunk" reports/codis_daily_update/pipeline.log \
            > reports/codis_daily_update/failed_chunks.log || true

          FAILED_CHUNK_COUNT=$(wc -l < reports/codis_daily_update/failed_chunks.log)
          echo "Failed CODIS chunks after retries: ${FAILED_CHUNK_COUNT}"

          exit "${PIPELINE_STATUS}"

      - name: Upload CODIS QC reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codis-qc-smoke-test-${{ github.run_id }}
          path: reports/codis_daily_update/
          if-no-files-found: error
          retention-days: 7
