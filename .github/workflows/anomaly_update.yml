name: Anomaly Update

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - CODIS Daily Update
    types:
      - completed

permissions:
  contents: write

concurrency:
  group: anomaly-update-${{ github.event.workflow_run.head_branch || github.ref_name }}
  cancel-in-progress: false

jobs:
  anomaly-update:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch || github.ref_name }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run anomaly update
        run: python -u anomaly.py

      - name: Commit anomaly results
        run: |
          git config --global user.email "allenstorm2005@gmail.com"
          git config --global user.name "Raingel (GitHub Action)"
          git add anomaly/result
          git status --short
          if git diff --cached --quiet; then
            echo "No anomaly changes to commit."
          else
            git commit -m "daily anomaly update $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          fi

      - name: Push changes
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ github.event.workflow_run.head_branch || github.ref_name }}
