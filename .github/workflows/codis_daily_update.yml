name: CODIS Daily Update

on:
  workflow_dispatch:
  schedule:
    - cron: '0 5 * * *'

jobs:
  codis-daily-update:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run CODIS daily update pipeline
        run: python -u tools/run_daily_codis_update.py

      - name: Commit changes
        run: |
          git config --global user.email "allenstorm2005@gmail.com"
          git config --global user.name "Raingel (GitHub Action)"
          git add data data_codis_rebuild_full data_codis_legacy_compatible reports README.md tools .github/workflows
          git diff --cached --quiet || git commit -m "daily CODIS update $(date -u '+%Y-%m-%d %H:%M:%S UTC')"

      - name: Push changes
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: main
