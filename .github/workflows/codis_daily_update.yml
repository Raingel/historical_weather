name: CODIS Daily Update

on:
  workflow_dispatch:
  schedule:
    - cron: '0 5 * * *'

permissions:
  contents: write

concurrency:
  group: codis-daily-update-${{ github.ref }}
  cancel-in-progress: false

jobs:
  codis-daily-update:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run CODIS daily update pipeline
        run: python -u tools/run_daily_codis_update.py --lookback-days 60

      - name: Commit changes
        run: |
          git config --global user.email "allenstorm2005@gmail.com"
          git config --global user.name "Raingel (GitHub Action)"
          git config --global core.autocrlf input
          git config --global core.safecrlf false
          git add -A .
          git status --short
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "daily CODIS update $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          fi

      - name: Push changes
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ github.ref_name }}
