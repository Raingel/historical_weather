name: CODIS Daily Update

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/codis_daily_update.yml'
  workflow_dispatch:
    inputs:
      start_date:
        description: "Backfill start date (YYYY-MM-DD). Leave blank to use lookback-days."
        required: false
        type: string
      end_date:
        description: "Backfill end date (YYYY-MM-DD). Leave blank to use lookback-days."
        required: false
        type: string
      lookback_days:
        description: "Used only when start/end date are blank."
        required: false
        default: "60"
        type: string
      timeout:
        description: "CODIS request timeout seconds."
        required: false
        default: "60"
        type: string
      max_retries:
        description: "Retries per CODIS request."
        required: false
        default: "6"
        type: string
      retry_backoff_seconds:
        description: "Linear backoff base seconds."
        required: false
        default: "5"
        type: string
      strict_failed_chunks:
        description: "Fail workflow if any chunk still fails after retries."
        required: false
        default: false
        type: boolean
  schedule:
    - cron: '0 5 * * *'

permissions:
  contents: write

concurrency:
  group: codis-daily-update-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codis-daily-update:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run CODIS daily update pipeline
        shell: bash
        run: |
          ARGS=(
            --lookback-days "${{ inputs.lookback_days || '60' }}"
            --timeout "${{ inputs.timeout || '60' }}"
            --max-retries "${{ inputs.max_retries || '6' }}"
            --retry-backoff-seconds "${{ inputs.retry_backoff_seconds || '5' }}"
          )
          if [ -n "${{ inputs.start_date }}" ] && [ -n "${{ inputs.end_date }}" ]; then
            ARGS+=(--start-date "${{ inputs.start_date }}" --end-date "${{ inputs.end_date }}")
          fi
          if [ "${{ inputs.strict_failed_chunks || 'false' }}" = "true" ]; then
            ARGS+=(--strict-failed-chunks)
          fi

          mkdir -p reports/codis_daily_update
          set +e
          set -o pipefail
          python -u tools/run_daily_codis_update.py "${ARGS[@]}" 2>&1 | tee reports/codis_daily_update/pipeline.log
          PIPELINE_STATUS=${PIPESTATUS[0]}
          set +o pipefail
          set -e

          grep -F "[WARN] skip chunk" reports/codis_daily_update/pipeline.log \
            > reports/codis_daily_update/failed_chunks.log || true

          FAILED_CHUNK_COUNT=$(wc -l < reports/codis_daily_update/failed_chunks.log)
          echo "Failed CODIS chunks after retries: ${FAILED_CHUNK_COUNT}"

          exit "${PIPELINE_STATUS}"

      - name: Upload CODIS QC reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codis-daily-update-qc-${{ github.run_id }}
          path: reports/codis_daily_update/
          if-no-files-found: warn
          retention-days: 30

      - name: Commit changes
        run: |
          git config --global user.email "allenstorm2005@gmail.com"
          git config --global user.name "Raingel (GitHub Action)"
          git config --global core.autocrlf input
          git config --global core.safecrlf false
          git add -A .
          git status --short
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "daily CODIS update $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          fi

      - name: Push changes
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ github.ref_name }}